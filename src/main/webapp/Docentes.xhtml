¿<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title></title>
    </h:head>
    <h:body>
        <p:card>
            <f:facet name="title">Gestionar Asinagturas</f:facet>
            <p:card style="width: 35rem; margin-bottom: 2em">
                <f:facet name="title">Gestionar Asignaturas</f:facet>

                <h:panelGrid columns="3">

                    <p:outputLabel for="txfCodigo" value="Nombre : " />
                    <p:inputText id="txfCodigo" value="#{controlDoc.docente.nombres}"></p:inputText>
                    <p:message for="txfCodigo"></p:message>

                    <p:outputLabel for="txfNombre" value="Apellido : " />
                    <p:inputText id="txfNombre" value="#{controlDoc.docente.apellidos}"></p:inputText>
                    <p:message for="txfNombre"></p:message>

                    <p:outputLabel for="txfCreditos" value="NUIP : " />
                    <p:inputNumber id="txfCreditos" value="#{controlDoc.docente.nuip}" ></p:inputNumber>
                    <p:message for="txfCreditos"></p:message>

                    <p:outputLabel for="txfIntensidad" value="Profesión : " />
                    <p:inputNumber id="txfIntensidad"
                                   value="#{controlDoc.docente.profesion}"></p:inputNumber>
                    <p:message for="txfIntensidad"></p:message>

                </h:panelGrid>

            </p:card>
            Esta es un elemento CARD de primeFaces
            <f:facet name="footer">
                <p:commandButton icon="pi pi-check" value ="guardar"/>
                <p:commandButton icon="pi pi-times" value ="cancelar"
                                 styleClass ="ui-buttun-secondary"
                                 style ="margin-left: .5em"/>
            </f:facet>
        </p:card>
    </h:body>
</html>
